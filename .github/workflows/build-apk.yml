# Rebuild after Dart syntax corrections.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org com.tarteel.ai --project-name tarteel /tmp/tarteel_scaffold
          cp -R /tmp/tarteel_scaffold/android ./android
      - name: Enable Android core library desugaring
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '/compileOptions[[:space:]]*{/a\        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            if grep -q 'coreLibraryDesugaring(' android/app/build.gradle.kts; then
              echo "Desugaring dependency already configured"
            elif grep -q '^dependencies[[:space:]]*{' android/app/build.gradle.kts; then
              sed -i '/^dependencies[[:space:]]*{/a\    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' android/app/build.gradle.kts
            else
              printf '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
            fi
          elif [ -f android/app/build.gradle ]; then
            sed -i '/compileOptions[[:space:]]*{/a\        coreLibraryDesugaringEnabled true' android/app/build.gradle
            if grep -q 'coreLibraryDesugaring ' android/app/build.gradle; then
              echo "Desugaring dependency already configured"
            elif grep -q '^dependencies[[:space:]]*{' android/app/build.gradle; then
              sed -i '/^dependencies[[:space:]]*{/a\    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"' android/app/build.gradle
            else
              printf '\n\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"\n}\n' >> android/app/build.gradle
            fi
          else
            echo "Android app Gradle file not found" >&2
            exit 1
          fi
          grep -n 'coreLibraryDesugaring' android/app/build.gradle*
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format source
        run: dart format lib/main.dart
      - name: Analyze source
        run: flutter analyze --no-fatal-infos
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarteel-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

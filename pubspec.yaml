name: tarteel_ai
description: Tarteel AI inspired Quran recitation practice and memorization tracker.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.3
  riverpod: ^2.6.1
  record: ^6.0.0
  audioplayers: ^6.1.0
  speech_to_text: ^7.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_svg: ^2.0.10
  font_awesome_flutter: ^10.8.0
  intl: ^0.19.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
